instemjobportal.dashboard:
  path: '/apply/{job}'
  defaults:
    _controller: '\Drupal\instemjobportal\Controller\DashboardController::dashboard'
  requirements:
    _permission: 'access content'

instemjobportal.add_node:
  path: '/apply/{job}/add/{node_type}'
  defaults:
    _controller: '\Drupal\instemjobportal\Controller\DashboardController::addNode'
  requirements:
    _permission: 'access content'
instemjobportal.preview_submit:
  path: '/apply/{job}/preview'
  defaults:
    _form: 'Drupal\instemjobportal\Form\PreviewSubmitForm'
    _title: 'Preview and Submit'
  requirements:
    _permission: 'access content'

instemjobportal.application_preview:
  path: '/application/{node}/preview'
  defaults:
    _controller: '\Drupal\instemjobportal\Controller\ApplicationPreviewController::preview'
    _title: 'Application'
  requirements:
    _permission: 'access content'
    node: \d+
